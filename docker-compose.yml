# Local development. `docker compose up`, then open http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432}
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/rails
      - bundle:/usr/local/bundle
    tty: true
    stdin_open: true
    depends_on:
      db:
        condition: service_healthy

  # Backup and restore tools (backup/, issue #54). Not started by `up`; used
  # by backup/restore-latest through `docker compose run`.
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  bundle:
