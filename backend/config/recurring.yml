# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # The daily crawl (#53): the whole pipeline (crawl → extract → match →
  # verify) for NRC, then EIA, at a quiet hour in the US. One job runs them
  # in turn, since EIA's rows enrich NRC's units. Verify only recommends;
  # nothing is published until a person approves it in the admin. Each
  # source is fetched at most once a day (Snapshot).
  daily_crawl:
    class: DataQuality::DailyCrawlJob
    schedule: every day at 3am America/New_York
  # Leads an official source names become proposals (#572), ahead of the
  # daily crawl's match, which proposes them as pending records.
  lead_proposals:
    class: LeadProposalsJob
    schedule: every day at 2am America/New_York

  # Marks runs cut off by a restart as failed, and queues the daily crawl
  # again (once a day per source) for a source whose run was cut off (#188).
  # Rebuilds cached pages after a data change, before visitors ask (#707).
  page_warm:
    class: PageWarmJob
    schedule: every 5 minutes

  data_quality_catch_up:
    class: DataQuality::CatchUpJob
    schedule: every hour at minute 30

  # PR Newswire's energy and utilities feeds hold only their 20 newest items,
  # so they're read every 3 hours and their items kept (wire_press, 3 Nov).
  wire_press:
    class: DataQuality::RunJob
    args: [ "wire_press" ]
    schedule: every 3 hours

  # Emails Tosin forwards to leads@ (#757): read every hour, so his reply comes soon.
  lead_forwards:
    class: DataQuality::RunJob
    args: [ "lead_forwards" ]
    schedule: every hour at minute 45

  # Asks for each source a published fact cites, never-checked first, then the oldest check, and
  # records its answer (#510). Never unpublishes anything.
  link_check:
    class: DataQuality::LinkCheckJob
    schedule: every day at 9am America/New_York

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
