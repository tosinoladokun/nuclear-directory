# Sources by category (#166): each of the 9 categories (docs/DATA.md section
# 4, in that order) and the sources that find or confirm its companies, from
# Data Quality's "Sources by bucket" table on #133, with #274-#276. Data
# Quality owns this list until #281 tags records by category.
#
# key: the category's slug, as Category (Bucket, #322) has it; it never
#   changes, so the match survives a rename. name: shown until the app's
#   own bucket names (#322) take over.
#
# status: live, built, planned, missing or hand (hand research, read by a
#   person, not nightly). A source with a `kind` (its crawler's source_kind)
#   is Live when the data says so: it has documents and a successful run in
#   the last 3 days. Otherwise it shows the status here.
# issue: the GitHub issue that plans or built it. crawler: true when, for
#   hand research, that issue is the crawler that will take it over.
# leads: a lead list (names to research), never cited.
# note: a muted note after the name.
# group / domain: hand research, counted from the Sources page's publisher
#   group, or from one domain in it.
categories:
  - key: utilities
    name: Utilities and operators
    sources:
      - { name: NRC reactor list, kind: nrc_reactor_list, status: built }
      - { name: EIA-860M generators, kind: eia_generators, status: built }
      - { name: EIA-860 plants, kind: eia_plants, status: built }
      - { name: EIA-860 owners, kind: eia_owners, status: built }
      - { name: NRC licensing pages (new reactors), status: planned, issue: 130 }
      - { name: State utility commission filings, status: planned, issue: 131 }
  - key: reactor-developers
    name: Reactor developers
    sources:
      - { name: NRC advanced-reactor and licensing pages, status: planned, issue: 130 }
      - { name: NRC unit pages (reactor vendor per plant), kind: nrc_reactor_vendors, status: built, issue: 388 }
      - { name: "DOE program pages (ARDP, GAIN vouchers, Fusion Milestone)", status: planned, issue: 124 }
      - { name: DOE awards (USAspending), kind: usaspending_doe_awards, status: built, issue: 260 }
      - { name: SBIR awards, status: planned, issue: 125 }
      - { name: GAIN directory, status: planned, issue: 257, leads: true }
      - { name: NRC notices in the Federal Register (news), kind: federal_register_nrc, status: built, issue: 126, note: project developers }
      - { name: SEC filings, status: planned, issue: 129, note: project developers }
      - { name: Company newsrooms (news), kind: company_newsrooms, status: built, issue: 128 }
  - key: fuel
    name: Fuel and materials
    sources:
      - { name: NRC fuel cycle facilities, kind: nrc_fuel_cycle, status: built, issue: 386 }
      - { name: DOE HALEU pages, kind: doe_programs, status: built, issue: 124 }
      - { name: DOE awards (USAspending), kind: usaspending_doe_awards, status: built, issue: 260 }
      - { name: DOE Isotope Program (isotope producers), kind: doe_isotope_sites, status: built, issue: 276 }
      - { name: NRC uranium recovery sites (mines and mills), kind: nrc_uranium_recovery, status: built, issue: 275 }
  - key: components
    name: Components and manufacturing
    sources:
      - { name: GAIN directory, status: planned, issue: 257, leads: true }
      - { name: ANS Buyers Guide, status: planned, issue: 258, leads: true }
      - { name: Company newsrooms, status: planned, issue: 128 }
      - { name: DOE awards (USAspending), kind: usaspending_doe_awards, status: built, issue: 260 }
      - { name: SBIR awards, status: planned, issue: 125 }
      - { name: A primary register of suppliers, status: missing, note: none exists }
  - key: waste-decommissioning
    name: Waste and decommissioning
    sources:
      - { name: NRC decommissioning sites list, kind: nrc_decommissioning, status: built, issue: 312 }
      - { name: NRC ISFSI (spent-fuel storage) list, status: planned, issue: 274 }
      - { name: NRC notices in the Federal Register, status: planned, issue: 126 }
  - key: services
    name: Services and engineering
    sources:
      - { name: GAIN directory, status: planned, issue: 257, leads: true }
      - { name: DOE contracts and awards (USAspending), kind: usaspending_doe_awards, status: built, issue: 260 }
      - { name: Company newsrooms, status: planned, issue: 128 }
  - key: power-buyers
    name: Power buyers
    sources:
      - { name: Buyer and seller press releases and SEC filings, status: hand, issue: 253, note: "today's deals, researched by hand" }
      - { name: Buyer and seller press releases, status: planned, issue: 128 }
      - { name: SEC 8-K filings, status: planned, issue: 129 }
      - { name: State utility commission filings, status: planned, issue: 131 }
  - key: investors
    name: Investors
    sources:
      - { name: SEC Form D rounds, kind: sec_form_d, status: built, issue: 129 }
      - { name: "SEC 8-K and 10-K", status: planned, issue: 129 }
      - { name: Company newsrooms (funding rounds), status: planned, issue: 128 }
  - key: government-research
    name: Government and research
    sources:
      - { name: DOE awards (USAspending), kind: usaspending_doe_awards, status: built, issue: 260 }
      # The same crawl as Fuel's isotope producers: the labs and universities it names.
      - { name: DOE Isotope Program (national labs and universities), kind: doe_isotope_sites, status: built, issue: 276 }
      - { name: NRC research and test reactors list, kind: nrc_research_reactors, status: built, issue: 387 }

# Sources that cover the whole industry.
general:
  - { name: World Nuclear News, status: hand, group: news, domain: world-nuclear-news.org, note: "named reporting; never for deals" }
  - { name: ANS Nuclear Newswire, status: hand, group: news, domain: ans.org, note: "named reporting; never for deals" }
  - { name: ANS Nuclear News Daily, status: hand, leads: true, note: "daily digest, read by a person" }
  - { name: Talkwalker news alerts, status: hand, leads: true, note: "feeds in the private ops repo" }
  - { name: Reddit (r/nuclear and others), status: hand, leads: true, note: "read by a person; no bot access" }
  - { name: Company newsrooms, status: hand, group: company-sites, issue: 128, crawler: true }
  - { name: Companies' own pages (Enrich), kind: company_pages, status: built, issue: 479, note: "read on request, one company at a time" }
  - { name: Federal Register, status: planned, issue: 126 }
  - { name: "First reads: NRC press releases, DIU (stored, no claims yet)", kind: first_read_pages, status: built }
  - { name: NASA nuclear news (fission power), kind: nasa_nuclear_news, status: built, note: "NASA's own announcements" }
  - { name: Trade press feeds (WNN and ANS), kind: trade_press, status: built, issue: 127, leads: true, note: "leads for Data Quality, never cited" }
  - { name: Daily lead researcher, status: planned, issue: 278, note: "leads for Data Quality, not facts" }
