notes: 'Legal name stated on fluor.com/about-fluor ("Fluor Corporation, a FORTUNE 500 engineering, procurement and construction (EPC) company", the page description) and on the cover of Fluor''s 2025 Form 10-K as Fluor hosts it (q4cdn PDF linked from fluor.com corporate reporting): "FLUOR CORPORATION (Exact name of registrant as specified in its charter)". Piketon (#740): the building work Tosin meant is the Centrus expansion above (Fluor EPC since Feb 2026); there is no plant-link kind for an EPC contractor, so it is a supplies link to Centrus. The DOE Portsmouth cleanup is separate: Fluor-BWXT Portsmouth, LLC held the D&D contract from 2010; since 2025 it is Southern Ohio Cleanup Company, LLC (Amentum, Fluor Federal Services, Cavendish Nuclear USA), per fluor.com: "DOE awarded a $4.6 billion D&D contract to Fluor-BWXT Portsmouth, LLC, a Fluor-led partnership, in 2010. In 2025, the Southern Ohio Cleanup Company, LLC, which includes team members Amentum and Fluor, assumed responsibility for the site under a new $5.87 billion follow-on contract." No record for Fluor-BWXT Portsmouth (its contract ended) and no BWXT link (no current tie a primary source states); the Portsmouth site is not in the directory. NuScale: no link. Fluor sold its stake through 2025-26 (Fluor release, Feb 2026: 71 million shares sold, the remaining 40 million to be sold in Q2 2026), and reports in 2026 say the sale of the last 40 million is complete; invests_in would be false today. sec_cik not set: the 10-K cover read does not state it.'
