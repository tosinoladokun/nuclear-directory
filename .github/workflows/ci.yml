name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  # Which work this PR needs (.github/scripts/ci_scope.rb): the unit tests, the
  # browser (system) tests and the Lighthouse audit. Data-only PRs (seeds, data
  # steps, crawler code) run unit tests only; page code runs everything.
  # Pushes to main always run everything. "test" and "lighthouse" are required
  # checks, so those two jobs always run and report: they pass with a
  # "skipped" note when there was nothing for them to do.
  scope:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      test: ${{ steps.scope.outputs.test }}
      system: ${{ steps.scope.outputs.system }}
      lighthouse: ${{ steps.scope.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The classifier comes from the base commit (main), not the PR, so a
          # PR can't change the rules for itself. No copy there: run all.
          # --no-renames lists a moved file's old path too, so moving app code
          # into a docs path still counts as an app change.
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             git show "$BASE:.github/scripts/ci_scope.rb" > "$RUNNER_TEMP/ci_scope.rb" 2>/dev/null; then
            git diff --name-only --no-renames "$BASE...$HEAD" | ruby "$RUNNER_TEMP/ci_scope.rb"
          else
            printf 'test=true\nsystem=true\nlighthouse=true\n' >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop -f github

  blueprint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - name: Check render.yaml
        run: ruby .github/scripts/check_blueprint.rb

      - name: Test the render.yaml check
        run: ruby .github/scripts/check_blueprint_test.rb

      - name: Test the CI scope rules
        run: ruby .github/scripts/ci_scope_test.rb

      - name: Test the backup ordering
        run: .github/scripts/backup_order_test.sh

      - name: Test who holds the preview slot
        run: .github/scripts/preview_slot_test.sh

  # The unit tests. Skipped when scope says there's nothing to test; the
  # required "test" job below still reports.
  unit-tests:
    needs: scope
    # Runs unless scope says it isn't needed; if scope itself failed, or its
    # answer is missing, runs anyway.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Build CSS
        run: bin/rails tailwindcss:build

      # Link-preview cards are rasterized with libvips (#245), as in the Docker images.
      - name: Install libvips
        timeout-minutes: 8
        # apt on the runners stalls now and then (26 Oct: one run sat here for
        # over 20 minutes; a normal install takes seconds). Each command is cut
        # off after 2 minutes and the whole thing tried twice.
        run: |
          for attempt in 1 2; do
            timeout 120 sudo apt-get update -qq &&
              (timeout 120 sudo apt-get install -y --no-install-recommends libvips42t64 ||
                timeout 120 sudo apt-get install -y --no-install-recommends libvips42) && exit 0
            echo "apt stalled or failed (attempt $attempt)"
          done
          exit 1

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rails test

  # Browser tests (#362, #363): layout measured on the page and JavaScript,
  # in headless Chrome, which ubuntu-latest has. Its own job and its own
  # freshly loaded database (rows the unit tests leave in the shared test
  # database would break loading the fixtures), so it runs beside the unit
  # tests, not after them.
  system-tests:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.system != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Build CSS
        run: bin/rails tailwindcss:build

      - name: Install libvips
        timeout-minutes: 8
        # apt on the runners stalls now and then (26 Oct: one run sat here for
        # over 20 minutes; a normal install takes seconds). Each command is cut
        # off after 2 minutes and the whole thing tried twice.
        run: |
          for attempt in 1 2; do
            timeout 120 sudo apt-get update -qq &&
              (timeout 120 sudo apt-get install -y --no-install-recommends libvips42t64 ||
                timeout 120 sudo apt-get install -y --no-install-recommends libvips42) && exit 0
            echo "apt stalled or failed (attempt $attempt)"
          done
          exit 1

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run system tests
        timeout-minutes: 10
        # The runner's own chromedriver ($CHROMEWEBDRIVER is set on GitHub's
        # images), matching its Chrome; no download.
        run: CHROMEDRIVER_PATH="$CHROMEWEBDRIVER/chromedriver" bin/rails db:test:prepare test:system

      # Capybara saves a screenshot of the page for each failing system test.
      - name: Upload system test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: backend/tmp/screenshots
          if-no-files-found: ignore

  # The required "test" check. It always runs and reports: it fails if the unit
  # or the browser tests failed (or were cancelled), and passes, with a note,
  # when scope left them out.
  test:
    needs: [ scope, unit-tests, system-tests ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Report
        env:
          UNIT: ${{ needs.unit-tests.result }}
          SYSTEM: ${{ needs.system-tests.result }}
        run: |
          echo "unit tests: $UNIT, system tests: $SYSTEM"
          if [ "$UNIT" = failure ] || [ "$UNIT" = cancelled ] || [ "$SYSTEM" = failure ] || [ "$SYSTEM" = cancelled ]; then
            echo "::error::A test job didn't pass."
            exit 1
          fi
          [ "$UNIT" = skipped ] && echo "skipped: no changes that need the unit tests" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$SYSTEM" = skipped ] && echo "skipped: no page, JavaScript or controller changes, so no browser tests" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

  # #90: Lighthouse on a phone profile (simulated 4G, mid-range CPU) against
  # the production build with seed data. Fails below 95 for performance or
  # accessibility, or when the largest content takes over 2.5 s.
  lighthouse-audit:
    needs: scope
    # Runs unless scope says it isn't needed; if scope itself failed, runs anyway.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.lighthouse != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      SECRET_KEY_BASE_DUMMY: "1"
      FORCE_SSL: "false"
      RAILS_LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build assets
        run: bin/rails assets:precompile

      - name: Prepare database with seed data
        run: bin/rails db:prepare db:seed

      - name: Start the app
        run: |
          bin/rails server -p 3000 -d
          for i in $(seq 1 30); do curl -sf http://localhost:3000/up && break; sleep 1; done

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: backend/lighthouse

  # The required "lighthouse" check. It always runs and reports: it fails if the
  # audit failed (or was cancelled), and passes, with a note, when scope found
  # no public page code in the change.
  lighthouse:
    needs: [ scope, lighthouse-audit ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Report
        env:
          AUDIT: ${{ needs.lighthouse-audit.result }}
        run: |
          echo "lighthouse audit: $AUDIT"
          if [ "$AUDIT" = failure ] || [ "$AUDIT" = cancelled ]; then
            echo "::error::The Lighthouse audit didn't pass."
            exit 1
          fi
          [ "$AUDIT" = skipped ] && echo "skipped: no page changes" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
