name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  # Which of test and lighthouse this PR needs (.github/scripts/ci_scope.rb):
  # docs-only PRs skip both, render.yaml/.github-only PRs skip lighthouse.
  # Pushes to main always run everything. A skipped job reports success, so
  # required checks still pass.
  scope:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      test: ${{ steps.scope.outputs.test }}
      lighthouse: ${{ steps.scope.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The classifier comes from the base commit (main), not the PR, so a
          # PR can't change the rules for itself. No copy there: run all.
          # --no-renames lists a moved file's old path too, so moving app code
          # into a docs path still counts as an app change.
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             git show "$BASE:.github/scripts/ci_scope.rb" > "$RUNNER_TEMP/ci_scope.rb" 2>/dev/null; then
            git diff --name-only --no-renames "$BASE...$HEAD" | ruby "$RUNNER_TEMP/ci_scope.rb"
          else
            printf 'test=true\nlighthouse=true\n' >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop -f github

  blueprint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - name: Check render.yaml
        run: ruby .github/scripts/check_blueprint.rb

      - name: Test the render.yaml check
        run: ruby .github/scripts/check_blueprint_test.rb

      - name: Test the CI scope rules
        run: ruby .github/scripts/ci_scope_test.rb

      - name: Test the backup ordering
        run: .github/scripts/backup_order_test.sh

      - name: Test who holds the preview slot
        run: .github/scripts/preview_slot_test.sh

  test:
    needs: scope
    # Runs unless scope says it isn't needed; if scope itself failed, runs anyway.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test == 'true') }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Build CSS
        run: bin/rails tailwindcss:build

      # Link-preview cards are rasterized with libvips (#245), as in the Docker images.
      - name: Install libvips
        run: sudo apt-get update -qq && (sudo apt-get install -y --no-install-recommends libvips42t64 || sudo apt-get install -y --no-install-recommends libvips42)

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rails test

      # Browser tests (#362, #363): layout measured on the page and JavaScript,
      # in headless Chrome, which ubuntu-latest has. On a freshly loaded schema:
      # rows the unit tests leave in the shared test database would break
      # loading the fixtures.
      - name: Run system tests
        timeout-minutes: 10
        # The runner's own chromedriver ($CHROMEWEBDRIVER is set on GitHub's
        # images), matching its Chrome; no download.
        run: CHROMEDRIVER_PATH="$CHROMEWEBDRIVER/chromedriver" bin/rails db:test:prepare test:system

      # Capybara saves a screenshot of the page for each failing system test.
      - name: Upload system test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: backend/tmp/screenshots
          if-no-files-found: ignore

  # #90: Lighthouse on a phone profile (simulated 4G, mid-range CPU) against
  # the production build with seed data. Fails below 95 for performance or
  # accessibility, or when the largest content takes over 2.5 s.
  lighthouse:
    needs: scope
    # Runs unless scope says it isn't needed; if scope itself failed, runs anyway.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.lighthouse == 'true') }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      SECRET_KEY_BASE_DUMMY: "1"
      FORCE_SSL: "false"
      RAILS_LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build assets
        run: bin/rails assets:precompile

      - name: Prepare database with seed data
        run: bin/rails db:prepare db:seed

      - name: Start the app
        run: |
          bin/rails server -p 3000 -d
          for i in $(seq 1 30); do curl -sf http://localhost:3000/up && break; sleep 1; done

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: backend/lighthouse
