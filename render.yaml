# Render Blueprint: production hosting (issue #52). The deploy runbook is in
# the private backups repo (nuclear-directory-backups).
# Spec: https://render.com/docs/blueprint-spec
#
# One web service (Rails + Solid Queue inside Puma) and one Postgres database,
# both in Oregon. Secrets are `sync: false`: Render asks for them once, when
# the Blueprint is first created, and they then live only in the dashboard.
# Never put a secret value in this file.

services:
  - type: web
    name: nuclear-directory
    runtime: docker
    # 0.5 CPU / 512 MB, Render's "Starter" instance type.
    plan: 0.5c-512mb
    region: oregon
    branch: main
    # Paths are relative to the repo root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Runs in the new image before it takes traffic. A failed schema migration
    # stops the deploy and the previous version keeps serving. bin/deploy-data
    # (#301) then runs the data steps when the seed or db/data/ changed:
    # backup, seed:check, db:seed, data migrations, a report on the PR. It
    # never fails the deploy; a stop alerts instead. Render runs this without
    # a shell, so both steps are in bin/pre-deploy.
    preDeployCommand: bin/pre-deploy
    healthCheckPath: /up
    # Custom domain (#57). Render adds it as unverified until the Namecheap
    # records point here, then issues certificates. Adding the bare domain
    # also adds www.nuclear-directory.org, which redirects to it.
    domains:
      - nuclear-directory.org
    # Serve only at the custom domain, so nuclear-directory.onrender.com
    # isn't a second, indexable copy of the site (canonical tags and the
    # sitemap use the requesting host).
    renderSubdomainPolicy: disabled
    # Deploy a commit on main only after its GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    # Only app changes trigger a build; README-only merges don't redeploy.
    # (render.yaml changes are picked up by the Blueprint sync.)
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nuclear-directory-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      # Run the Solid Queue supervisor inside Puma (no separate worker).
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # Memory on the 512 MB instance (#53 crash, 12 Oct). Solid Queue runs in
      # async mode (threads, not forks; config/puma.rb), Puma in single mode,
      # and jemalloc hands freed memory back to the system quickly after a
      # spike. Idle: about 130 MB, down from 280 MB.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: MALLOC_CONF
        value: dirty_decay_ms:1000,narenas:2,background_thread:true
      # In async mode Puma (3 threads) and Solid Queue (worker: 3 job threads
      # plus polling and heartbeat; dispatcher; scheduler; supervisor) share
      # one connection pool, about 11 at most. A ceiling, not opened up front;
      # two instances during a deploy still fit Postgres's 103 easily.
      - key: DB_POOL
        value: "12"
      # Non-secret settings, kept here so changes are reviewed in a PR.
      # Same values as .env.example; they must stay two different models.
      - key: OPENROUTER_EXTRACT_MODEL
        value: openai/gpt-6-luna
      - key: OPENROUTER_VERIFY_MODEL
        value: anthropic/claude-haiku-5.5
      # Model spend cap per calendar month, in US dollars.
      - key: DATA_QUALITY_MONTHLY_BUDGET
        value: "5"
      # Secrets, pasted in the dashboard. POSTHOG_HOST may be left blank
      # (lib/analytics.rb has a default).
      - key: RAILS_MASTER_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      # Addresses or ranges whose visits are marked internal (#205), e.g.
      # Tosin's home IP. Set in the dashboard only, so it isn't in the repo.
      - key: INTERNAL_IPS
        sync: false
      # Error reporting; leave blank to turn it off. See
      # config/initializers/sentry.rb.
      - key: SENTRY_DSN
        sync: false
      # The data step on deploy (#301, bin/deploy-data). The kill switch: it
      # runs only when this is "on", set in the dashboard; blank or anything
      # else turns it off.
      - key: AUTO_DATA_DEPLOY
        sync: false
      # Its backup before writing: the same script, key and repo as the
      # backup cron job below, tagged backup-<time>-predeploy.
      - key: BACKUP_AGE_RECIPIENT
        value: age160huv36mvxec0v3jjdvd238anktgzrsplrjkd53q2e0l2slslyfqzlu9cu
      - key: BACKUP_REPO
        value: tosinoladokun/nuclear-directory-backups
      - key: BACKUP_KEEP
        value: "14"
      # The backup cron job's token: the backups repo only, Contents read/write.
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      # Posts the data step's report on the merged PR: a fine-grained token
      # for nuclear-directory, Issues and Pull requests write only.
      - key: DEPLOY_REPORT_GITHUB_TOKEN
        sync: false

  # UI previews: a free instance that runs whichever PR was last labelled
  # "preview" (.github/workflows/preview.yml pushes it to the preview branch).
  # It uses its own database, nuclear_directory_preview, owned by the
  # preview_app role, which can't connect to production. Its DATABASE_URL is
  # set by hand in the dashboard, never fromDatabase (that would be
  # production). No production secrets, no jobs, no Sentry or PostHog, and
  # NOINDEX keeps it out of search engines. Runbook: the private backups repo.
  - type: web
    name: nuclear-directory-preview
    runtime: docker
    plan: free
    region: oregon
    branch: preview
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /up
    # Free instances have no pre-deploy step, so every start empties and
    # reloads the preview database (bin/preview-start, which refuses any
    # database but nuclear_directory_preview).
    dockerCommand: ./bin/preview-start
    envVars:
      # postgres://preview_app:<password>@<internal host>/nuclear_directory_preview
      - key: DATABASE_URL
        sync: false
      - key: NOINDEX
        value: "1"
      # One Puma thread and one database connection, so an old instance still
      # running during a deploy plus the new one's reset fit preview_app's
      # CONNECTION LIMIT 3.
      - key: RAILS_MAX_THREADS
        value: "1"
      # Puma in single mode: Render's default ran it as a 1-worker cluster,
      # an extra process on a 512 MB free instance.
      - key: WEB_CONCURRENCY
        value: "0"
      # Lets db:schema:load reset this (non-production) database.
      - key: DISABLE_DATABASE_ENVIRONMENT_CHECK
        value: "1"
      # Its own key, so no master key is needed here.
      - key: SECRET_KEY_BASE
        generateValue: true
      # The preview's admin login (preview@nuclear-directory.org), made on
      # every start by bin/preview-start. Set by hand; only on the preview.
      - key: PREVIEW_ADMIN_PASSWORD
        sync: false

  # Daily encrypted off-site backup (#54); runbook in the private backups repo.
  # Runs inside Render's private network, so the database stays closed to
  # the internet.
  - type: cron
    name: nuclear-directory-backup
    runtime: docker
    # Billed per second of run time (about a minute a day), $1/month minimum.
    plan: 0.5c-512mb
    region: oregon
    branch: main
    dockerfilePath: ./backup/Dockerfile
    # The repo root: the image takes the backup script from backend/, which
    # the web service also runs before a data deploy (#301).
    dockerContext: .
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backup/**
        - backend/bin/backup
        - backend/lib/backup/**
    # Every day at 09:00 UTC (1–2 a.m. in California). The daily crawl runs at
    # 3 a.m. New York time (07:00 UTC in summer, 08:00 UTC in winter), so each
    # backup comes one to two hours after it and includes that day's crawl.
    schedule: "0 9 * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nuclear-directory-db
          property: connectionString
      # age public key. Only its private half, kept in Tosin's password
      # manager, can decrypt the backups. The web service's copy must match.
      - key: BACKUP_AGE_RECIPIENT
        value: age160huv36mvxec0v3jjdvd238anktgzrsplrjkd53q2e0l2slslyfqzlu9cu
      - key: BACKUP_REPO
        value: tosinoladokun/nuclear-directory-backups
      # Two weeks of daily backups.
      - key: BACKUP_KEEP
        value: "14"
      # Fine-grained token for the backups repo only (Contents read/write).
      - key: BACKUP_GITHUB_TOKEN
        sync: false

databases:
  - name: nuclear-directory-db
    # 0.1 CPU / 256 MB, Render's "Basic-256mb". Move to 0.5c-1g if needed.
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: nuclear_directory_production
    user: nuclear_directory
    # Storage is billed per GB; it can grow later but never shrink.
    diskSizeGB: 1
    # The web service reaches the database over Render's private network.
    # From the internet, only Tosin's Mac, for local Metabase (#111), signing
    # in as the read-only metabase_ro role over SSL. One single-host /32 with
    # a description; never remove this key (Render would open the database to
    # everyone). When his IP changes, replace the /32 (Metabase runbook, private backups repo);
    # to close it again, set `ipAllowList: []`.
    ipAllowList:
      - source: 99.110.208.39/32
        description: Tosin home (Metabase), 2026-10-11
